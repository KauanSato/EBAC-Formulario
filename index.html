<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <h1>Formulários de Cadastro</h1>
    <form>
        <label for="text">Seu Nome</label>
        <input id="text" type="Seu Nome" />
        <br />
        <label for="email">Seu email</label>
        <input id="email" type="Seu email" />
        <br />
        <label for="senha">Sua senha</label>
        <input id="senha" type="Sua senha" />
        <br />
        <button type="submit">
            Cadastrar
        </button>
    </form>
</body>
</html>
